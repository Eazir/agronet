spring.application.name=AgroNet-B
server.servlet.context-path=/system/api/v1
server.port=8080
server.address=0.0.0.0

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:AgroNet}
spring.datasource.username=${DB_USER:Tyr}
