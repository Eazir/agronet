<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AgroNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'agro-primary': '#0e4a56',
                        'agro-secondary': '#0d6971',
                        'agro-accent': '#0a9798',
                        'agro-highlight': '#06d9cc',
                        'agro-light': '#0ffff7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">
<div class="max-w-md w-full mx-4">
    <!-- Logo y Volver al inicio -->
    <div class="text-center mb-8">
        <a href="/static" class="inline-flex items-center text-agro-primary hover:text-agro-secondary transition duration-300 mb-4">
            <i class="fas fa-arrow-left mr-2"></i> Volver al inicio
        </a>
        <a href="/static" class="text-agro-primary font-bold text-3xl flex items-center justify-center">
            <i class="fas fa-seedling text-agro-light mr-2"></i>
            AgroNet
        </a>
        <p class="text-gray-600 mt-2">Conectando el campo con tu mesa</p>
    </div>

    <!-- Card del Login -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-agro-primary to-agro-accent p-6">
            <h2 class="text-2xl font-bold text-white text-center">Iniciar Sesión</h2>
            <p class="text-agro-light text-center mt-2">Accede a tu cuenta AgroNet</p>
        </div>

        <div class="p-8">
            <form th:action="@{/login}" method="post" class="space-y-6">
                <!-- Campo Usuario/Email -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user text-agro-accent mr-2"></i>Usuario o Email
                    </label>
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300"
                           placeholder="Ingresa tu usuario o email">
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock text-agro-accent mr-2"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300 pr-12"
                               placeholder="Ingresa tu contraseña">
                        <button type="button"
                                id="togglePassword"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-agro-primary transition duration-300">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Recordar contraseña -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-agro-highlight focus:ring-agro-highlight border-gray-300 rounded">
                        <label for="remember" class="ml-2 block text-sm text-gray-700">Recordar sesión</label>
                    </div>
                    <a href="#" class="text-sm text-agro-primary hover:text-agro-secondary transition duration-300">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <!-- Botón de Login -->
                <button type="submit"
                        class="w-full bg-gradient-to-r from-agro-accent to-agro-highlight text-white py-3 px-4 rounded-lg font-semibold hover:from-agro-highlight hover:to-agro-accent transform hover:scale-105 transition duration-300 shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
                </button>

                <!-- Mensajes de error (Thymeleaf) -->
                <div th:if="${param.error}" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm">
                    <i class="fas fa-exclamation-triangle mr-2"></i>Usuario o contraseña incorrectos
                </div>
            </form>

            <!-- Separador -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-center text-gray-600 text-sm">
                    ¿No tienes una cuenta?
                    <a href="/registro" class="text-agro-primary font-semibold hover:text-agro-secondary transition duration-300 ml-1">
                        Regístrate aquí
                    </a>
                </p>
            </div>
        </div>
    </div>

    <!-- Información adicional -->
    <div class="mt-8 text-center">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm text-gray-600">
            <div class="flex items-center justify-center">
                <i class="fas fa-shield-alt text-agro-accent mr-2"></i>
                <span>Seguro y confiable</span>
            </div>
            <div class="flex items-center justify-center">
                <i class="fas fa-truck text-agro-accent mr-2"></i>
                <span>Envíos directos</span>
            </div>
            <div class="flex items-center justify-center">
                <i class="fas fa-hand-holding-heart text-agro-accent mr-2"></i>
                <span>Apoya al productor</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle para mostrar/ocultar contraseña
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });

    // Efecto de focus en los inputs
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('ring-2', 'ring-agro-highlight');
        });
        input.addEventListener('blur', function() {
            this.parentElement.classList.remove('ring-2', 'ring-agro-highlight');
        });
    });
</script>
</body>
</html>
