<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Productos - AgroNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'agro-primary': '#0e4a56',
                        'agro-secondary': '#0d6971',
                        'agro-accent': '#0a9798',
                        'agro-highlight': '#06d9cc',
                        'agro-light': '#0ffff7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- Menú de Navegación -->
<nav class="bg-agro-primary shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a th:href="@{/AgroNet}" class="text-white font-bold text-2xl flex items-center">
                    <i class="fas fa-seedling text-agro-light mr-2"></i>
                    AgroNet
                </a>
            </div>

            <!-- Menú desktop -->
            <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                    <a th:href="@{/AgroNet}" class="text-agro-light hover:bg-agro-secondary px-3 py-2 rounded-md text-sm font-medium transition duration-300">
                        <i class="fas fa-home mr-1"></i> Inicio
                    </a>
                    <a th:href="@{/panel-controlP}" class="text-white hover:bg-agro-secondary px-3 py-2 rounded-md text-sm font-medium transition duration-300">
                        <i class="fas fa-tachometer-alt mr-1"></i> Panel
                    </a>
                    <a th:href="@{/logout}" class="text-white hover:bg-red-600 px-3 py-2 rounded-md text-sm font-medium transition duration-300">
                        <i class="fas fa-sign-out-alt mr-1"></i> Cerrar Sesión
                    </a>
                </div>
            </div>

            <!-- Botón móvil -->
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-white hover:text-agro-light focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Menú móvil -->
    <div id="mobile-menu" class="md:hidden hidden bg-agro-secondary">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a th:href="@{/AgroNet}" class="text-agro-light block px-3 py-2 rounded-md text-base font-medium">
                <i class="fas fa-home mr-2"></i> Inicio
            </a>
            <a th:href="@{/panel-controlP}" class="text-white hover:bg-agro-primary block px-3 py-2 rounded-md text-base font-medium">
                <i class="fas fa-tachometer-alt mr-2"></i> Panel
            </a>
            <a th:href="@{/logout}" class="text-white hover:bg-agro-primary block px-3 py-2 rounded-md text-base font-medium">
                <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>

<!-- Contenido Principal -->
<div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
            <div class="mb-4 sm:mb-0">
                <h1 class="text-2xl sm:text-3xl font-bold text-agro-primary">
                    <i class="fas fa-apple-alt mr-3"></i>Mis Productos
                </h1>
                <p class="text-agro-secondary mt-2">Gestiona y administra tus productos agrícolas</p>
            </div>
            <a th:href="@{/crear-producto}"
               class="bg-gradient-to-r from-agro-primary to-agro-accent text-white py-3 px-6 rounded-lg font-semibold hover:from-agro-secondary hover:to-agro-highlight transition duration-300 inline-block text-center">
                <i class="fas fa-plus mr-2"></i>Nuevo Producto
            </a>
        </div>
    </div>

    <!-- Mensajes -->
    <div th:if="${#strings.length(success) > 0}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
        <p class="text-green-700 flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span th:text="${success}"></span>
        </p>
    </div>
    <div th:if="${#strings.length(error) > 0}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 flex items-center">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span th:text="${error}"></span>
        </p>
    </div>

    <!-- Lista de Productos -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Producto</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoría</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Origen</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Precio/kg</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                <tr th:each="producto : ${productos}" class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10">
                                <img th:if="${producto.urlImagen}" th:src="${producto.urlImagen}" class="h-10 w-10 rounded-full object-cover">
                                <div th:unless="${producto.urlImagen}" class="h-10 w-10 bg-agro-light rounded-full flex items-center justify-center">
                                    <i class="fas fa-apple-alt text-agro-primary"></i>
                                </div>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900" th:text="${producto.nombreProducto}"></div>
                                <div class="text-sm text-gray-500" th:text="${producto.descripcion != null} ? ${#strings.substring(producto.descripcion, 0, 30)} + '...' : 'Sin descripción'"></div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${producto.codigoCategoria.nombreCategoria}"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${producto.origenProducto} ?: 'No especificado'"></td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        <span th:if="${producto.stock != null}" th:text="'$' + ${#numbers.formatDecimal(producto.stock.precioKilo, 1, 2)}"></span>
                        <span th:unless="${producto.stock != null}" class="text-gray-400">-</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span th:if="${producto.stock != null}" th:text="${#numbers.formatDecimal(producto.stock.cantidadKg, 1, 2)} + ' kg'"></span>
                        <span th:unless="${producto.stock != null}" class="text-gray-400">-</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${producto.estado}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                    Activo
                                </span>
                        <span th:unless="${producto.estado}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">
                                    Inactivo
                                </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <a th:href="@{/editar-producto/{id}(id=${producto.codigoProducto})}"
                           class="text-agro-accent hover:text-agro-primary mr-4">
                            <i class="fas fa-edit"></i> Editar
                        </a>
                        <a th:href="@{/eliminar-producto/{id}(id=${producto.codigoProducto})}"
                           class="text-red-600 hover:text-red-900"
                           onclick="return confirm('¿Estás seguro de que quieres eliminar este producto?')">
                            <i class="fas fa-trash"></i> Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Mensaje si no hay productos -->
    <div th:if="${success != null and #strings.length(success) > 0}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
        <p class="text-green-700 flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span th:text="${success}"></span>
        </p>
    </div>
    <div th:if="${error != null and #strings.length(error) > 0}" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 flex items-center">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span th:text="${error}"></span>
        </p>
    </div>
</div>

<!-- Script para el menú móvil -->
<script>
    document.getElementById('mobile-menu-button').addEventListener('click', function() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    });
</script>
</body>
</html>
