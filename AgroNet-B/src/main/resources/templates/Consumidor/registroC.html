<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AgroNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'agro-primary': '#0e4a56',
                        'agro-secondary': '#0d6971',
                        'agro-accent': '#0a9798',
                        'agro-highlight': '#06d9cc',
                        'agro-light': '#0ffff7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen py-8 font-sans">
<div class="max-w-2xl w-full mx-auto px-4">
    <!-- Logo y Título -->
    <div class="text-center mb-8">
        <a href="/static" class="inline-flex items-center text-agro-primary hover:text-agro-secondary transition duration-300">
            <i class="fas fa-seedling text-3xl mr-2"></i>
            <span class="text-2xl font-bold">AgroNet</span>
        </a>
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Crear Cuenta</h1>
        <p class="text-gray-600 mt-2">Únete a nuestra comunidad de productores y consumidores</p>
    </div>

    <!-- Formulario de Registro -->
    <div class="bg-white rounded-lg shadow-lg p-6">
        <form th:action="@{/registro}" method="post" th:object="${productor}">
            <!-- Tipo de Persona -->
            <div class="mb-6">
                <label for="tipoUsuario" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-user-tag mr-2 text-agro-accent"></i>Tipo de Persona
                </label>
                <select id="tipoUsuario"
                        name="tipoUsuario"
                        th:field="*{tipoUsuario}"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300 appearance-none bg-white">
                    <option value="" disabled selected>Selecciona el tipo de persona</option>
                    <option value="natural">Persona Natural</option>
                    <option value="juridica">Persona Jurídica</option>
                </select>
            </div>

            <!-- Documento y Tipo de Documento -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Tipo de Documento -->
                <div>
                    <label for="codigoDoc" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-id-card mr-2 text-agro-accent"></i>Tipo de Documento
                    </label>
                    <select id="codigoDoc"
                            name="codigoDoc"
                            th:field="*{codigoDoc}"
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300 appearance-none bg-white">
                        <option value="" disabled selected>Selecciona tipo de documento</option>
                        <option th:each="tipoDoc : ${tiposDocumento}"
                                th:value="${tipoDoc.codigo}"
                                th:text="${tipoDoc.nombre}">
                        </option>
                    </select>
                </div>

                <!-- Número de Documento -->
                <div>
                    <label for="docProductor" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-hashtag mr-2 text-agro-accent"></i>Número de Documento
                    </label>
                    <input type="number"
                           id="docProductor"
                           name="docProductor"
                           th:field="*{docProductor}"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300"
                           placeholder="Ingresa tu número de documento">
                </div>
            </div>

            <!-- Nombre de Usuario -->
            <div class="mb-6">
                <label for="nombreUsuario" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-user mr-2 text-agro-accent"></i>Nombre de Usuario
                </label>
                <input type="text"
                       id="nombreUsuario"
                       name="nombreUsuario"
                       th:field="*{nombreUsuario}"
                       required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300"
                       placeholder="Elige un nombre de usuario">
                <p class="text-xs text-gray-500 mt-1">Este será tu nombre visible en la plataforma</p>
            </div>

            <!-- Email -->
            <div class="mb-6">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-envelope mr-2 text-agro-accent"></i>Correo Electrónico
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       th:field="*{email}"
                       required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300"
                       placeholder="tu@email.com">
            </div>

            <!-- Contraseña -->
            <div class="mb-6">
                <label for="contraseña" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2 text-agro-accent"></i>Contraseña
                </label>
                <div class="relative">
                    <input type="password"
                           id="contraseña"
                           name="contraseña"
                           th:field="*{contraseña}"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300 pr-12"
                           placeholder="Crea una contraseña segura">
                    <button type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-agro-primary transition duration-300">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-1">La contraseña debe tener al menos 8 caracteres</p>
            </div>

            <!-- Confirmar Contraseña -->
            <div class="mb-6">
                <label for="confirmarContraseña" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2 text-agro-accent"></i>Confirmar Contraseña
                </label>
                <div class="relative">
                    <input type="password"
                           id="confirmarContraseña"
                           name="confirmarContraseña"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300 pr-12"
                           placeholder="Repite tu contraseña">
                    <button type="button"
                            id="toggleConfirmPassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-agro-primary transition duration-300">
                        <i class="fas fa-eye" id="eyeConfirmIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Términos y Condiciones -->
            <div class="mb-6">
                <div class="flex items-start">
                    <input type="checkbox"
                           id="terminos"
                           name="terminos"
                           required
                           class="h-4 w-4 text-agro-highlight focus:ring-agro-highlight border-gray-300 rounded mt-1">
                    <label for="terminos" class="ml-2 text-sm text-gray-600">
                        Acepto los
                        <a href="/terminos" class="text-agro-accent hover:text-agro-primary transition duration-300">Términos y Condiciones</a>
                        y la
                        <a href="/privacidad" class="text-agro-accent hover:text-agro-primary transition duration-300">Política de Privacidad</a>
                    </label>
                </div>
            </div>

            <!-- Botón de Registro -->
            <button type="submit"
                    class="w-full bg-gradient-to-r from-agro-primary to-agro-accent text-white py-3 px-4 rounded-lg font-semibold hover:from-agro-secondary hover:to-agro-highlight transition duration-300 transform hover:scale-105 shadow-lg">
                <i class="fas fa-user-plus mr-2"></i>Crear Cuenta
            </button>

            <!-- Mensajes de validación -->
            <div th:if="${#fields.hasErrors()}" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-red-700 text-sm flex items-center">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    Por favor, corrige los errores en el formulario.
                </p>
            </div>
        </form>

        <!-- Separador -->
        <div class="mt-6 pt-6 border-t border-gray-200">
            <p class="text-center text-gray-600 text-sm">
                ¿Ya tienes una cuenta?
                <a href="/login" class="text-agro-accent font-semibold hover:text-agro-primary transition duration-300 ml-1">
                    Inicia sesión aquí
                </a>
            </p>
        </div>
    </div>

    <!-- Enlace de regreso al home -->
    <div class="text-center mt-6">
        <a href="/static" class="text-agro-accent hover:text-agro-primary transition duration-300 flex items-center justify-center">
            <i class="fas fa-arrow-left mr-2"></i>Volver al inicio
        </a>
    </div>
</div>

<!-- Scripts para mostrar/ocultar contraseñas -->
<script>
    // Toggle para contraseña principal
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('contraseña');
        const eyeIcon = document.getElementById('eyeIcon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    });

    // Toggle para confirmar contraseña
    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
        const confirmPasswordInput = document.getElementById('confirmarContraseña');
        const eyeConfirmIcon = document.getElementById('eyeConfirmIcon');

        if (confirmPasswordInput.type === 'password') {
            confirmPasswordInput.type = 'text';
            eyeConfirmIcon.classList.remove('fa-eye');
            eyeConfirmIcon.classList.add('fa-eye-slash');
        } else {
            confirmPasswordInput.type = 'password';
            eyeConfirmIcon.classList.remove('fa-eye-slash');
            eyeConfirmIcon.classList.add('fa-eye');
        }
    });

    // Validación de coincidencia de contraseñas
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('contraseña').value;
        const confirmPassword = document.getElementById('confirmarContraseña').value;

        if (password !== confirmPassword) {
            e.preventDefault();
            alert('Las contraseñas no coinciden. Por favor, verifica.');
            document.getElementById('confirmarContraseña').focus();
        }
    });
</script>
</body>
</html>
