<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto - AgroNet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'agro-primary': '#0e4a56',
                        'agro-secondary': '#0d6971',
                        'agro-accent': '#0a9798',
                        'agro-highlight': '#06d9cc',
                        'agro-light': '#0ffff7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
<!-- Menú de Navegación -->
<nav class="bg-agro-primary shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center">
                <a th:href="@{/}" class="text-white font-bold text-2xl flex items-center">
                    <i class="fas fa-seedling text-agro-light mr-2"></i>
                    AgroNet
                </a>
            </div>

            <!-- Menú desktop -->
            <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                    <a th:href="@{/}" class="text-agro-light hover:bg-agro-secondary px-3 py-2 rounded-md text-sm font-medium transition duration-300">
                        <i class="fas fa-home mr-1"></i> Inicio
                    </a>
                    <a th:href="@{/mis-productos}" class="text-white hover:bg-agro-secondary px-3 py-2 rounded-md text-sm font-medium transition duration-300">
                        <i class="fas fa-arrow-left mr-1"></i> Volver a Productos
                    </a>
                </div>
            </div>

            <!-- Botón móvil -->
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-white hover:text-agro-light focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Menú móvil -->
    <div id="mobile-menu" class="md:hidden hidden bg-agro-secondary">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a th:href="@{/}" class="text-agro-light block px-3 py-2 rounded-md text-base font-medium">
                <i class="fas fa-home mr-2"></i> Inicio
            </a>
            <a th:href="@{/mis-productos}" class="text-white hover:bg-agro-primary block px-3 py-2 rounded-md text-base font-medium">
                <i class="fas fa-arrow-left mr-2"></i> Volver a Productos
            </a>
        </div>
    </div>
</nav>

<!-- Contenido Principal -->
<div class="max-w-4xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
    <!-- Header -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <div class="bg-agro-light text-agro-primary p-3 rounded-full mr-4">
                    <i class="fas fa-edit text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-agro-primary">Editar Producto</h1>
                    <p class="text-agro-secondary mt-1">Modifica la información de tu producto</p>
                </div>
            </div>
            <div class="text-sm text-gray-500">
                ID: <span class="font-mono" th:text="${producto.codigoProducto}"></span>
            </div>
        </div>
    </div>

    <!-- Vista previa de imagen -->
    <div th:if="${producto.urlImagen}" class="mb-6 bg-white rounded-lg shadow-lg p-6">
        <h3 class="text-lg font-semibold text-agro-primary mb-4">Vista previa de la imagen</h3>
        <div class="flex justify-center">
            <img th:src="${producto.urlImagen}"
                 th:alt="${producto.nombreProducto}"
                 class="max-w-full h-48 object-cover rounded-lg shadow-md">
        </div>
    </div>

    <!-- Formulario -->
    <div class="bg-white rounded-lg shadow-lg p-6">
        <form th:action="@{/actualizar-producto/{id}(id=${producto.codigoProducto})}" method="post" th:object="${producto}">
            <input type="hidden" th:field="*{codigoProducto}" />

            <!-- Nombre del Producto -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-signature mr-2 text-agro-accent"></i>Nombre del Producto *
                </label>
                <input type="text"
                       th:field="*{nombreProducto}"
                       required
                       maxlength="100"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300">
            </div>

            <!-- Categoría -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-tags mr-2 text-agro-accent"></i>Categoría *
                </label>
                <select th:field="*{codigoCategoria}"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300">
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.codigoCategoria}"
                            th:text="${categoria.nombreCategoria}"
                            th:selected="${categoria.codigoCategoria == producto.codigoCategoria.codigoCategoria}">
                    </option>
                </select>
            </div>

            <!-- Origen del Producto -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-map-marker-alt mr-2 text-agro-accent"></i>Origen del Producto
                </label>
                <input type="text"
                       th:field="*{origenProducto}"
                       maxlength="200"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300">
            </div>

            <!-- Descripción -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-align-left mr-2 text-agro-accent"></i>Descripción
                </label>
                <textarea th:field="*{descripcion}"
                          rows="4"
                          maxlength="500"
                          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300 resize-none"></textarea>
                <div class="flex justify-between text-xs text-gray-500 mt-1">
                    <span>Máximo 500 caracteres</span>
                    <span id="descripcion-counter" th:text="${#strings.length(producto.descripcion)} + '/500'">0/500</span>
                </div>
            </div>

            <!-- URL de Imagen -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-image mr-2 text-agro-accent"></i>URL de la Imagen
                </label>
                <input type="url"
                       th:field="*{urlImagen}"
                       maxlength="1000"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agro-highlight focus:border-transparent transition duration-300">
                <p class="text-xs text-gray-500 mt-1">Enlace a la imagen de tu producto</p>
            </div>

            <!-- Estado -->
            <div class="mb-8">
                <label class="flex items-center">
                    <input type="checkbox"
                           th:field="*{estado}"
                           class="h-4 w-4 text-agro-highlight focus:ring-agro-highlight border-gray-300 rounded">
                    <span class="ml-2 text-sm text-gray-700">Producto activo (disponible para la venta)</span>
                </label>
            </div>

            <!-- Información de fechas -->
            <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                <h4 class="font-medium text-gray-700 mb-2">Información del producto</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-gray-600">
                    <div>
                        <i class="fas fa-calendar-plus mr-2"></i>
                        <span>Creación: </span>
                        <span th:text="${#temporals.format(producto.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                    <div th:if="${producto.fechaActualizacion}">
                        <i class="fas fa-calendar-check mr-2"></i>
                        <span>Última actualización: </span>
                        <span th:text="${#temporals.format(producto.fechaActualizacion, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-200">
                <button type="submit"
                        class="bg-gradient-to-r from-agro-primary to-agro-accent text-white py-3 px-6 rounded-lg font-semibold hover:from-agro-secondary hover:to-agro-highlight transition duration-300 flex-1">
                    <i class="fas fa-save mr-2"></i>Actualizar Producto
                </button>
                <a th:href="@{/mis-productos}"
                   class="bg-gray-200 text-gray-700 py-3 px-6 rounded-lg font-semibold hover:bg-gray-300 transition duration-300 text-center">
                    <i class="fas fa-times mr-2"></i>Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<!-- Scripts -->
<script>
    // Menú móvil
    document.getElementById('mobile-menu-button').addEventListener('click', function() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    });

    // Contador de caracteres para descripción
    const descripcionTextarea = document.querySelector('textarea[th\\:field="*{descripcion}"]');
    const counter = document.getElementById('descripcion-counter');

    if (descripcionTextarea && counter) {
        descripcionTextarea.addEventListener('input', function() {
            counter.textContent = this.value.length + '/500';
        });
    }
</script>
</body>
</html>
